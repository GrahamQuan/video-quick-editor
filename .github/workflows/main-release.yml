name: Main release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install locked dependencies
        # Cached postinstall output can flatten Electron framework symlinks.
        # Keep the package download cache, but extract Electron on every runner.
        run: pnpm install --frozen-lockfile --config.side-effects-cache=false
      - name: Verify Electron framework symlinks
        run: |
          frameworks="apps/video-quick-editor-desktop/node_modules/electron/dist/Electron.app/Contents/Frameworks"
          for framework in "$frameworks"/*.framework; do
            test -L "$framework/Versions/Current"
            test -L "$framework/Resources"
          done
      - name: Prepare runner media tools
        run: |
          test "$(uname -m)" = arm64
          brew install ffmpeg-full
          # These links affect only the disposable runner; tests use these explicit paths.
          ln -sf "$(brew --prefix ffmpeg-full)/bin/ffmpeg" /opt/homebrew/bin/ffmpeg
          ln -sf "$(brew --prefix ffmpeg-full)/bin/ffprobe" /opt/homebrew/bin/ffprobe
          /opt/homebrew/bin/ffmpeg -version
          /opt/homebrew/bin/ffprobe -version
      - name: Validate release automation
        run: node --test scripts/main-release.test.js
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and real media tests
        run: pnpm test
      - name: Packaged Electron tests
        run: pnpm test:e2e
      - name: Upload failed Electron test diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: electron-test-failure-${{ github.run_id }}
          path: apps/video-quick-editor-desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Set incremental patch version
        run: node scripts/main-release.js prepare
      - name: Build DMG
        run: pnpm package
      - name: Verify package and prepare release assets
        run: node scripts/main-release.js bundle
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: main-release-${{ github.run_id }}
          path: release-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: main-release-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: main-release-${{ github.run_id }}
          path: release-artifacts/
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/main-release.js publish
